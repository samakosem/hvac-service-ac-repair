# Phase 8 (PR #12) live verification. Read-only.
# Waits for Vercel's production deployment of the PR #12 merge, confirms the domain serves it
# (AC repair guide, Yorba Linda AC repair notes), then crawls every
# sitemap URL and runs scripts/verify-preview.mjs (canonicals, robots, sitemap, schema, GTM, forms).
name: SEO phase 8 production verification

on:
  push:
    branches: [ci/seo-live-verify]
    paths: [.github/workflows/seo-phase8-production.yml]

permissions:
  contents: read
  deployments: read

env:
  MERGE_SHA: 39eab3ac5092fd40c3f87759ff8b4eb2eee4ddb6
  PRODUCTION_URL: https://www.hvacserviceacrepair.com

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the Vercel production deployment to be READY
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            dep=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${MERGE_SHA}&environment=Production&per_page=20" --jq '[.[] | select(.creator.login == "vercel[bot]")] | first')
            if [ -n "$dep" ] && [ "$dep" != "null" ]; then
              id=$(jq -r .id <<<"$dep")
              state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq 'first.state // "pending"')
              echo "Production deployment $id: $state"
              case "$state" in
                success) break ;;
                failure|error|inactive) echo "::error::Vercel production deployment ended in '$state'"; exit 1 ;;
              esac
            else
              echo "No Vercel production deployment for $MERGE_SHA yet"
            fi
            [ "$(date +%s)" -ge "$deadline" ] && { echo "::error::Timed out"; exit 1; }
            sleep 20
          done

      - name: Production domain serves the Phase 8 build
        run: |
          for i in $(seq 1 12); do
            if curl -sS "$PRODUCTION_URL/air-conditioning/ac-repair" | grep -q 'How an AC Repair Diagnosis Works'; then
              echo "AC repair guide live"
              yl=$(curl -sS "$PRODUCTION_URL/air-conditioning/ac-repair/yorba-linda")
              grep -q 'Yorba Linda is our operational base' <<<"$yl" || { echo "::error::YL wording missing"; exit 1; }
              grep -q 'our shop is on Yorba Linda Blvd. For heating' <<<"$yl" && { echo "::error::old shop wording live"; exit 1; }
              curl -sS "$PRODUCTION_URL/heating" | grep -q 'We are based in Yorba Linda' || { echo "::error::heating wording missing"; exit 1; }
              r=$(curl -sS -o /dev/null -w "%{http_code} %{redirect_url}" "$PRODUCTION_URL/hvac-repair"); echo "/hvac-repair -> $r"
              echo "YL and heating wording live"; exit 0
            fi
            echo "Domain not updated yet, retrying"; sleep 15
          done
          echo "::error::Production domain does not serve the Phase 8 build"; exit 1

      - name: Crawl every sitemap URL
        run: |
          python3 ci/.github/seo-checks/crawl.py "$PRODUCTION_URL" after
          awk '{print $1}' after/status.txt | sort | uniq -c
          if grep -v '^200 ' after/status.txt; then echo "::error::non-200 sitemap URLs"; exit 1; fi

      - name: SEO checks (verify-preview.mjs)
        run: node site/scripts/verify-preview.mjs --preview "$PRODUCTION_URL" --concurrency 6
