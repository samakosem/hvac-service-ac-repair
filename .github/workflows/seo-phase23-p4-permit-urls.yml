# Phase 2.3 P4: read-only check of official building/permit office pages used on city hubs.
name: SEO phase 2.3 P4 permit URLs
on:
  push:
    branches: [ci/seo-live-verify]
    paths: [.github/workflows/seo-phase23-p4-permit-urls.yml, .github/seo-checks/p4_permit_urls.py]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pip install --quiet beautifulsoup4 lxml
      - run: python3 .github/seo-checks/p4_permit_urls.py
