# Phase 6: read-only probes. Resolves the two Google Business Profile short links, fetches
# production robots.txt, and requests key pages with major search/AI crawler user agents
# (UA-only test: it shows how the CDN responds to the string, not how it treats verified bot IPs).
name: SEO phase 6 probe
on:
  push:
    branches: [ci/seo-live-verify]
    paths: [.github/workflows/seo-phase6-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: robots.txt and crawler user agents
        run: |
          B=https://www.hvacserviceacrepair.com
          curl -sS "$B/robots.txt"; echo
          for ua in "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" \
                    "Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)" \
                    "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; OAI-SearchBot/1.0; +https://openai.com/searchbot)" \
                    "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; PerplexityBot/1.0; +https://perplexity.ai/perplexitybot)" \
                    "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; GPTBot/1.1; +https://openai.com/gptbot)"; do
            for p in / /air-conditioning/ac-repair /service-areas/orange-county/placentia /sitemap.xml; do
              r=$(curl -sS -o /tmp/b -w "%{http_code} %{size_download}" -A "$ua" "$B$p"); h1=$(grep -c "<h1" /tmp/b || true); echo "$(echo $ua | grep -oE '(Googlebot|bingbot|OAI-SearchBot|PerplexityBot|GPTBot)') $p $r h1=$h1"
            done
          done
          curl -sSI "$B/" | grep -iE "^(x-robots-tag|server|x-vercel|cf-)" || true
