# Phase 5 (PR #9) live verification. Read-only.
# Waits for Vercel's production deployment of the PR #9 merge, confirms the domain serves it
# (AC repair notes on 12 OC pages, Yorba Linda claims removed), then crawls every
# sitemap URL and runs scripts/verify-preview.mjs (canonicals, robots, sitemap, schema, GTM, forms).
name: SEO phase 5 production verification

on:
  push:
    branches: [ci/seo-live-verify]
    paths: [.github/workflows/seo-phase5-production.yml]

permissions:
  contents: read
  deployments: read

env:
  MERGE_SHA: 979037041bab7d5d71d570187dabdc4ae59c848f
  PRODUCTION_URL: https://www.hvacserviceacrepair.com

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_SHA }}
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the Vercel production deployment to be READY
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            dep=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${MERGE_SHA}&environment=Production&per_page=20" --jq '[.[] | select(.creator.login == "vercel[bot]")] | first')
            if [ -n "$dep" ] && [ "$dep" != "null" ]; then
              id=$(jq -r .id <<<"$dep")
              state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq 'first.state // "pending"')
              echo "Production deployment $id: $state"
              case "$state" in
                success) break ;;
                failure|error|inactive) echo "::error::Vercel production deployment ended in '$state'"; exit 1 ;;
              esac
            else
              echo "No Vercel production deployment for $MERGE_SHA yet"
            fi
            [ "$(date +%s)" -ge "$deadline" ] && { echo "::error::Timed out"; exit 1; }
            sleep 20
          done

      - name: Production domain serves the Phase 5 build
        run: |
          for i in $(seq 1 12); do
            if curl -sS "$PRODUCTION_URL/air-conditioning/ac-repair/costa-mesa" | grep -q 'id="local-notes-heading"'; then
              echo "AC repair notes live"
              n=0
              for c in yorba-linda placentia villa-park tustin santa-ana costa-mesa huntington-beach newport-beach mission-viejo laguna-niguel san-clemente garden-grove; do
                curl -sS "$PRODUCTION_URL/air-conditioning/ac-repair/$c" | grep -q 'id="local-notes-heading"' && n=$((n+1))
              done
              echo "notes on $n/12 pages"; [ "$n" = 12 ] || exit 1
              curl -sS "$PRODUCTION_URL/air-conditioning/ac-repair/anaheim" | grep -q 'id="local-notes-heading"' && { echo "::error::unexpected notes on Anaheim"; exit 1; }
              curl -sS "$PRODUCTION_URL/air-conditioning/ac-repair/yorba-linda" | grep -q 'Serving Weir Canyon' && { echo "::error::Weir Canyon claim still live"; exit 1; }
              for h in placentia costa-mesa yorba-linda; do curl -sS "$PRODUCTION_URL/service-areas/orange-county/$h" | grep -qE 'Recent Work in|Job Photos from|Where We Work in' && { echo "::error::empty owner section rendered on $h"; exit 1; }; done
              echo "Anaheim has no notes; Weir Canyon claim gone; hub owner sections hidden"; exit 0
            fi
            echo "Domain not updated yet, retrying"; sleep 15
          done
          echo "::error::Production domain does not serve the Phase 5 build"; exit 1

      - name: Crawl every sitemap URL
        run: |
          python3 ci/.github/seo-checks/crawl.py "$PRODUCTION_URL" after
          awk '{print $1}' after/status.txt | sort | uniq -c
          if grep -v '^200 ' after/status.txt; then echo "::error::non-200 sitemap URLs"; exit 1; fi

      - name: SEO checks (verify-preview.mjs)
        run: node site/scripts/verify-preview.mjs --preview "$PRODUCTION_URL" --concurrency 6
