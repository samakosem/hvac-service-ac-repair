# Phase 2 audit evidence. Read-only: fetches public competitor pages and
# Google PageSpeed Insights (lab + CrUX field data), then prints compact JSON
# to the log. Changes nothing on any site.
name: SEO phase 2 evidence

on:
  push:
    branches: [ci/seo-live-verify]
    paths: [.github/workflows/seo-phase2-evidence.yml]

permissions:
  contents: read

jobs:
  competitors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch and summarise competitor pages
        run: |
          cat > urls.txt <<'EOF'
          https://www.hvacserviceacrepair.com/
          https://www.hvacserviceacrepair.com/air-conditioning/ac-repair/yorba-linda
          https://www.hvacserviceacrepair.com/service-areas/orange-county/yorba-linda
          https://servicechampions.com/?p=18624
          https://servicechampions.com/
          https://www.dialonesonshine.com/yorba-linda-hvac-services
          https://www.dialonesonshine.com/brea-ac-repair
          https://dialonesonshine.com/service-areas/placentia/heating-ac-repair
          https://dialonesonshine.com/service-areas/anaheim-heating-and-air-conditioning
          https://www.dialonesonshine.com/
          https://www.onehourheatandair.com/areas-we-service/yorba-linda-ca/
          EOF
          cat > summarise.py <<'EOF'
          import json, re, sys, html
          from html.parser import HTMLParser
          from urllib.parse import urlparse, urljoin

          class P(HTMLParser):
              def __init__(self, base):
                  super().__init__(); self.base = base
                  self.stack = []; self.text = []; self.h = []; self.title = ""
                  self.links = []; self.imgs = 0; self.scripts_ext = 0
                  self.ld = []; self.in_ld = False; self.meta = {}; self.cur_h = None
                  self.skip = 0
              def handle_starttag(self, t, a):
                  a = dict(a)
                  if t in ("script", "style", "noscript", "svg"):
                      self.skip += 1
                      if t == "script" and a.get("type") == "application/ld+json": self.in_ld = True; self.ld.append("")
                      if t == "script" and a.get("src"): self.scripts_ext += 1
                  if t in ("h1", "h2", "h3"): self.cur_h = [t, ""]
                  if t == "a" and a.get("href"): self.links.append(urljoin(self.base, a["href"]))
                  if t == "img": self.imgs += 1
                  if t == "meta" and a.get("name") in ("description", "robots"): self.meta[a["name"]] = a.get("content", "")
                  if t == "title": self.stack.append("title")
              def handle_endtag(self, t):
                  if t in ("script", "style", "noscript", "svg"):
                      self.skip = max(0, self.skip - 1); self.in_ld = False
                  if t in ("h1", "h2", "h3") and self.cur_h:
                      self.h.append((self.cur_h[0], " ".join(self.cur_h[1].split()))); self.cur_h = None
                  if t == "title" and self.stack: self.stack.pop()
              def handle_data(self, d):
                  if self.in_ld: self.ld[-1] += d; return
                  if self.stack and self.stack[-1] == "title": self.title += d
                  if self.skip: return
                  if self.cur_h is not None: self.cur_h[1] += d
                  self.text.append(d)

          def types(o, acc):
              if isinstance(o, dict):
                  t = o.get("@type")
                  if t: acc.update(t if isinstance(t, list) else [t])
                  for v in o.values(): types(v, acc)
              elif isinstance(o, list):
                  for v in o: types(v, acc)
              return acc

          url, path = sys.argv[1], sys.argv[2]
          final = sys.argv[3] if len(sys.argv) > 3 else url
          raw = open(path, encoding="utf-8", errors="replace").read()
          p = P(final); p.feed(raw)
          text = html.unescape(" ".join(" ".join(p.text).split()))
          words = len(text.split())
          host = urlparse(final).netloc.replace("www.", "")
          internal = [l for l in p.links if urlparse(l).netloc.replace("www.", "") == host]
          sch = set()
          for b in p.ld:
              try: types(json.loads(b), sch)
              except Exception: pass
          low = text.lower()
          def has(pat): return bool(re.search(pat, low))
          lic = re.findall(r"(?:lic(?:ense)?\.?\s*(?:#|no\.?|number)?\s*:?\s*|cslb\s*#?\s*)(\d{6,7})", low)
          out = {
            "url": url, "final": final, "title": " ".join(p.title.split()),
            "description": p.meta.get("description", ""), "robots": p.meta.get("robots", ""),
            "words": words, "h1": [h for t, h in p.h if t == "h1"],
            "h2": [h for t, h in p.h if t == "h2"][:25],
            "h3_count": sum(1 for t, _ in p.h if t == "h3"),
            "questions_in_headings": sum(1 for _, h in p.h if h.endswith("?")),
            "schema_types": sorted(sch), "internal_links": len(internal),
            "unique_internal_links": len(set(internal)), "images": p.imgs,
            "external_scripts": p.scripts_ext,
            "license_numbers": sorted(set(lic)),
            "signals": {k: has(v) for k, v in {
              "license_mention": r"licens|cslb", "insured": r"insured|insurance",
              "bbb": r"\bbbb\b|better business", "financing": r"financ",
              "warranty_guarantee": r"warrant|guarantee", "pricing": r"\$\s?\d",
              "since_year": r"since (19|20)\d\d", "family_owned": r"family[- ]owned",
              "nate": r"\bnate\b", "brand_dealer": r"lennox|carrier|trane|rheem|goodman|daikin|mitsubishi|bryant|american standard",
              "gallery_projects": r"gallery|our work|recent projects|case stud|before and after",
              "maintenance_plan": r"maintenance (plan|club|agreement|membership)|club member",
              "same_day": r"same[- ]day", "emergency_247": r"24/7|24 hours|twenty-four",
              "reviews_mention": r"review", "google_rating": r"\d\.\d\s*(stars?|rating|out of)",
              "neighborhood_terms": r"vista del verde|east lake|savi ranch|yorba linda blvd|imperial hwy|nixon library|richard nixon",
              "rebates": r"rebate|incentive|sce\b|socalgas|teco|tech clean",
              "seer2": r"seer2?", "refrigerant_r454b": r"r-?454b|r-?32|a2l",
            }.items()},
            "text_sample": text[:600],
          }
          print("EVIDENCE " + json.dumps(out))
          EOF
          sed -i 's/^          //' urls.txt summarise.py
          i=0
          while read -r u; do
            i=$((i+1))
            res=$(curl -sSL --compressed -m 30 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36" \
              -o "page$i.html" -w '%{http_code} %{url_effective}' "$u" || echo "000 $u")
            code=${res%% *}; final=${res#* }
            echo "FETCH $code $u -> $final ($(wc -c < page$i.html 2>/dev/null || echo 0) bytes)"
            [ "$code" = 200 ] && python3 summarise.py "$u" "page$i.html" "$final" || true
          done < urls.txt

  pagespeed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: PageSpeed Insights (mobile lab + CrUX field data)
        run: |
          for u in \
            https://www.hvacserviceacrepair.com/ \
            https://www.hvacserviceacrepair.com/air-conditioning/ac-repair/yorba-linda \
            https://www.hvacserviceacrepair.com/ac-repair/yorba-linda \
            https://www.hvacserviceacrepair.com/contact \
            https://servicechampions.com/ \
            https://www.dialonesonshine.com/ ; do
            for attempt in 1 2 3; do
              curl -sS -m 120 -o psi.json "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?strategy=mobile&category=performance&url=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$u")"
              python3 - "$u" <<'EOF' && break
          import json, sys
          d = json.load(open("psi.json"))
          if "error" in d:
              print("PSI_ERROR", sys.argv[1], d["error"].get("message", "")[:200]); sys.exit(1)
          lh = d.get("lighthouseResult", {}); a = lh.get("audits", {})
          def nv(k): return a.get(k, {}).get("numericValue")
          def field(x):
              if not x or not x.get("metrics"): return None
              return {"overall": x.get("overall_category"), **{k: {"p75": v.get("percentile"), "cat": v.get("category")} for k, v in x["metrics"].items()}}
          tp = a.get("third-party-summary", {}).get("details", {}).get("items", [])
          rb = a.get("resource-summary", {}).get("details", {}).get("items", [])
          out = {
            "url": sys.argv[1],
            "lab": {"score": lh.get("categories", {}).get("performance", {}).get("score"),
                    "LCP_ms": nv("largest-contentful-paint"), "CLS": nv("cumulative-layout-shift"),
                    "TBT_ms": nv("total-blocking-time"), "FCP_ms": nv("first-contentful-paint"),
                    "SI_ms": nv("speed-index"), "TTI_ms": nv("interactive"),
                    "lcp_element": (a.get("largest-contentful-paint-element", {}).get("details", {}).get("items") or [{}])[0].get("items", [{}])[0].get("node", {}).get("snippet") if a.get("largest-contentful-paint-element", {}).get("details") else None,
                    "unused_js_bytes": a.get("unused-javascript", {}).get("details", {}).get("overallSavingsBytes"),
                    "resources": {r.get("resourceType"): [r.get("requestCount"), r.get("transferSize")] for r in rb},
                    "third_party": [[t.get("entity", {}).get("text") if isinstance(t.get("entity"), dict) else t.get("entity"), round(t.get("blockingTime", 0)), t.get("transferSize")] for t in tp][:8]},
            "field_url": field(d.get("loadingExperience")),
            "field_url_is_origin_fallback": d.get("loadingExperience", {}).get("origin_fallback", False),
            "field_origin": field(d.get("originLoadingExperience")),
          }
          print("PSI " + json.dumps(out))
          EOF
              echo "retry $attempt for $u"; sleep 15
            done
          done
