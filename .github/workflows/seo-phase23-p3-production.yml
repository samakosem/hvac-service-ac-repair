# Phase 2.3 P3 (PR #5) live verification. Read-only.
# 1. Builds and crawls the pre-merge commit (90d6701, what production served) as the baseline,
#    and builds and crawls the merged commit.
# 2. Waits for Vercel's production deployment of the PR #5 merge to be READY.
# 3. Crawls the live site: it must match the merged build; canonicals, robots, links, GTM,
#    tel: links, forms and schema types must match the baseline; Ads titles/H1s unchanged;
#    removed claims absent; 24/7 hours and areaServed in HVACBusiness. Then the standard SEO
#    checks, the 181-page Ads check and browser checks with /api/contact intercepted
#    (no lead is submitted).
name: SEO phase 2.3 P3 production verification

on:
  push:
    branches: [ci/seo-live-verify]
    paths: [.github/workflows/seo-phase23-p3-production.yml]

permissions:
  contents: read
  deployments: read
  pull-requests: read

concurrency:
  group: seo-phase23-p3-production
  cancel-in-progress: true

env:
  PR_NUMBER: "5"
  APPROVED_HEAD: 1a2c63afdcf00a3810e316cfd0a2e0efea4903fe
  BASELINE_SHA: 90d67018b77b1e7f1f9ad9e4218c9e85b3a2b4e8
  PRODUCTION_URL: https://www.hvacserviceacrepair.com

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_HEAD }}
          path: site
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install parser
        run: pip install --quiet beautifulsoup4 lxml

      - name: Resolve the squash merge of PR #5
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          [ "$(jq -r .merged <<<"$pr")" = true ] || { echo "::error::PR #${PR_NUMBER} is not merged"; exit 1; }
          [ "$(jq -r .head.sha <<<"$pr")" = "$APPROVED_HEAD" ] || { echo "::error::Merged head is not the approved head"; exit 1; }
          sha=$(jq -r .merge_commit_sha <<<"$pr")
          echo "Merged: $sha; main: $(gh api repos/${GITHUB_REPOSITORY}/commits/main --jq .sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: "Baseline: build and crawl the pre-merge commit (identical to what production served before the merge)"
        run: |
          git -C site worktree add -q ../base "$BASELINE_SHA"
          cd base && npm ci --no-audit --no-fund >/dev/null && npx next build >/dev/null
          (npx next start -p 3000 >/dev/null 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3000/ && break; sleep 1; done
          cd .. && python3 ci/.github/seo-checks/crawl.py http://localhost:3000 before
          python3 site/scripts/seo-audit/extract.py before
          if ! grep -q 'Mon–Fri' before/html/_contact.html; then echo "::error::Baseline unexpectedly lacks the old hours"; exit 1; fi
          pkill -f next-server || true; sleep 2
          echo "BASELINE CAPTURED from $BASELINE_SHA"

      - name: Merged tree equals the approved head
        env:
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          cd site && git fetch -q origin "$MERGE_SHA"
          if git diff --quiet "$APPROVED_HEAD" "$MERGE_SHA"; then echo "Tree of $MERGE_SHA is identical to $APPROVED_HEAD"; else git diff --stat "$APPROVED_HEAD" "$MERGE_SHA"; echo "::error::Merged tree differs from the approved head"; exit 1; fi
          echo "Parents: $(git log -1 --format=%P "$MERGE_SHA") (single parent = squash)"

      - name: "Build and crawl the merged commit (expected production HTML)"
        env:
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          git -C site worktree add -q ../merged "$MERGE_SHA"
          cd merged && npm ci --no-audit --no-fund >/dev/null && npx next build >/dev/null
          (npx next start -p 3000 >/dev/null 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3000/ && break; sleep 1; done
          cd .. && python3 ci/.github/seo-checks/crawl.py http://localhost:3000 merged-crawl
          pkill -f next-server || true

      - name: Wait for the Vercel production deployment to be READY
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            dep=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${TARGET_SHA}&environment=Production&per_page=20" --jq '[.[] | select(.creator.login == "vercel[bot]")] | first')
            if [ -n "$dep" ] && [ "$dep" != "null" ]; then
              id=$(jq -r .id <<<"$dep")
              status=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq 'first // {}')
              state=$(jq -r '.state // "pending"' <<<"$status")
              echo "Production deployment $id (sha $(jq -r .sha <<<"$dep")): $state"
              case "$state" in
                success) echo "READY: $(jq -r .environment_url <<<"$status")"; break ;;
                failure|error|inactive) echo "::error::Vercel production deployment $id ended in state '$state'"; exit 1 ;;
              esac
            else
              echo "No Vercel production deployment for $TARGET_SHA yet"
            fi
            [ "$(date +%s)" -ge "$deadline" ] && { echo "::error::Timed out waiting for the production deployment"; exit 1; }
            sleep 20
          done

      - name: Confirm the production domain serves the merged build
        run: |
          for i in $(seq 1 12); do
            if curl -sS "$PRODUCTION_URL/service-areas/santa-barbara-county" | grep -q '24/7 Emergency Service'; then echo "Production domain serves the P3 build"; exit 0; fi
            echo "Domain not updated yet, retrying"; sleep 15
          done
          echo "::error::Production domain does not serve the P3 build"; exit 1

      - name: "Live crawl + comparison with the baseline and the merged build"
        run: |
          python3 ci/.github/seo-checks/crawl.py "$PRODUCTION_URL" after
          awk '{print $1}' after/status.txt | sort | uniq -c
          if grep -v '^200 ' after/status.txt; then echo "::error::non-200 sitemap URLs"; exit 1; fi
          python3 ci/.github/seo-checks/p3_compare.py before after merged-crawl

      - name: "SEO checks 1-9 (sitemap, canonicals, robots, structured data, Ads pages, GTM/phone/forms, noindex, redirects)"
        shell: bash
        run: |
          set -o pipefail
          node site/scripts/verify-preview.mjs --preview "$PRODUCTION_URL" --concurrency 6 | tee seo.txt

      - name: "Hosts redirect with 308 and all 181 Ads pages keep GTM, tel: and the form"
        run: python3 ci/.github/seo-checks/p0_apex.py 308

      - name: "Browser: 16 pages incl. 6 Ads pages, desktop and mobile; form validation and mocked submission (no real lead)"
        run: |
          mkdir pw && cd pw && npm init -y >/dev/null && npm i playwright-core@1.56.1 --no-audit --no-fund >/dev/null
          cp ../ci/.github/seo-checks/p3_browser.cjs . && mkdir shots
          CHROME_PATH=$(command -v google-chrome) node p3_browser.cjs shots "$PRODUCTION_URL" | tee out.txt
          node - <<'JS'
          const lines = require("fs").readFileSync("out.txt", "utf8").trim().split("\n");
          let fail = lines.length !== 32;
          for (const l of lines) {
            const [path, vp, ...rest] = l.split(" "); const r = JSON.parse(rest.join(" "));
            const ok = { status200: r.status === 200, noRedirect: r.redirects.length === 0, noJsErrors: r.errs.length === 0, callLinks: r.tel > 0, noOverflow: r.overflow === 0 };
            if (r.form) Object.assign(ok, { validationBlocksEmpty: r.form.errorsOnEmpty > 0 && r.form.callsAfterEmpty === 0, oneMockedRequest: r.form.calls === 1,
              thankYou: r.form.url.startsWith("/thank-you"), singleConversionEvent: r.form.events.filter((e) => e === "form filled").length === 1 });
            const bad = Object.entries(ok).filter(([, v]) => !v).map(([k]) => k);
            console.log(`${bad.length ? "FAIL" : "PASS"} ${path} ${vp}${r.form ? " (form)" : ""}${bad.length ? ": " + bad.join(", ") : ""}`);
            if (bad.length) fail = true;
          }
          console.log(`views: ${lines.length}`);
          process.exit(fail ? 1 : 0);
          JS
