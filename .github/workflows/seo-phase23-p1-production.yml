# Phase 2.3 P1 (PR #4) live verification. Read-only.
# 1. Builds and crawls the pre-merge commit (a28afa8, what production served before) as the baseline.
# 2. Waits for Vercel's production deployment of the PR #4 merge to be READY.
# 3. Crawls the live site and compares every page with the baseline: only the three
#    approved hubs may differ. Checks the hubs' titles, descriptions, canonicals,
#    structured data, 24/7 hours and city service links, then runs the standard SEO
#    checks, the Ads page check and browser checks of the hubs.
# No leads are submitted: /api/contact is intercepted in the browser and answered
# locally, and analytics requests are blocked.
name: SEO phase 2.3 P1 production verification

on:
  push:
    branches: [ci/seo-live-verify]
    paths: [.github/workflows/seo-phase23-p1-production.yml]

permissions:
  contents: read
  deployments: read
  pull-requests: read

concurrency:
  group: seo-phase23-p1-production
  cancel-in-progress: true

env:
  PR_NUMBER: "4"
  APPROVED_HEAD: 7ab10d50dda89d039802cf8e0870f4764a5085a9
  BASELINE_SHA: a28afa88752e444385bfc8bb0d7559d8d675e371
  PRODUCTION_URL: https://www.hvacserviceacrepair.com

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_HEAD }}
          path: site
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install parser
        run: pip install --quiet beautifulsoup4 lxml

      - name: Resolve the squash merge of PR #4
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          [ "$(jq -r .merged <<<"$pr")" = true ] || { echo "::error::PR #${PR_NUMBER} is not merged"; exit 1; }
          [ "$(jq -r .head.sha <<<"$pr")" = "$APPROVED_HEAD" ] || { echo "::error::Merged head is not the approved head"; exit 1; }
          sha=$(jq -r .merge_commit_sha <<<"$pr")
          echo "Merged: $sha; main: $(gh api repos/${GITHUB_REPOSITORY}/commits/main --jq .sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: "Baseline: build and crawl the pre-merge commit (identical to what production served before the merge)"
        run: |
          git -C site worktree add -q ../base "$BASELINE_SHA"
          cd base && npm ci --no-audit --no-fund >/dev/null && npx next build >/dev/null
          (npx next start -p 3000 >/dev/null 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3000/ && break; sleep 1; done
          cd .. && python3 ci/.github/seo-checks/crawl.py http://localhost:3000 before
          python3 site/scripts/seo-audit/extract.py before
          if grep -q 'Placentia HVAC: Furnace' before/html/_service-areas_orange-county_placentia.html; then echo "::error::Baseline unexpectedly contains P1"; exit 1; fi
          echo "BASELINE CAPTURED from $BASELINE_SHA"

      - name: Merged tree equals the approved head
        env:
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          cd site && git fetch -q origin "$MERGE_SHA"
          if git diff --quiet "$APPROVED_HEAD" "$MERGE_SHA"; then echo "Tree of $MERGE_SHA is identical to $APPROVED_HEAD"; else git diff --stat "$APPROVED_HEAD" "$MERGE_SHA"; echo "::error::Merged tree differs from the approved head"; exit 1; fi
          echo "Parents: $(git log -1 --format=%P "$MERGE_SHA") (single parent = squash)"

      - name: Wait for the Vercel production deployment to be READY
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            dep=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${TARGET_SHA}&environment=Production&per_page=20" --jq '[.[] | select(.creator.login == "vercel[bot]")] | first')
            if [ -n "$dep" ] && [ "$dep" != "null" ]; then
              id=$(jq -r .id <<<"$dep")
              status=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq 'first // {}')
              state=$(jq -r '.state // "pending"' <<<"$status")
              echo "Production deployment $id (sha $(jq -r .sha <<<"$dep")): $state"
              case "$state" in
                success) echo "READY: $(jq -r .environment_url <<<"$status")"; break ;;
                failure|error|inactive) echo "::error::Vercel production deployment $id ended in state '$state'"; exit 1 ;;
              esac
            else
              echo "No Vercel production deployment for $TARGET_SHA yet"
            fi
            [ "$(date +%s)" -ge "$deadline" ] && { echo "::error::Timed out waiting for the production deployment"; exit 1; }
            sleep 20
          done

      - name: Confirm the production domain serves the merged build
        run: |
          for i in $(seq 1 12); do
            if curl -sS "$PRODUCTION_URL/service-areas/orange-county/placentia" | grep -q 'Placentia HVAC: Furnace &amp; AC Service'; then echo "Production domain serves the P1 build"; exit 0; fi
            echo "Domain not updated yet, retrying"; sleep 15
          done
          echo "::error::Production domain does not serve the P1 build"; exit 1

      - name: "Live crawl after merge + comparison with the baseline (only the 3 hubs may differ)"
        run: |
          python3 ci/.github/seo-checks/crawl.py "$PRODUCTION_URL" after
          awk '{print $1}' after/status.txt | sort | uniq -c
          if grep -v '^200 ' after/status.txt; then echo "::error::non-200 sitemap URLs"; exit 1; fi
          python3 ci/.github/seo-checks/p1_compare.py before after

      - name: Every internal link on the 3 hubs returns 200 directly
        run: |
          echo "links: $(grep -c . hub_links.txt)"
          bad=$(xargs -P 6 -I{} curl -sS -o /dev/null -w "%{http_code} {}\n" "$PRODUCTION_URL{}" < hub_links.txt | grep -v '^200 ' || true)
          [ -z "$bad" ] && echo "all return 200 directly" || { echo "::error::$bad"; exit 1; }

      - name: "SEO checks 1-9 (sitemap, canonicals, robots, structured data, Ads pages, GTM/phone/forms, noindex, redirects)"
        shell: bash
        run: |
          set -o pipefail
          node site/scripts/verify-preview.mjs --preview "$PRODUCTION_URL" --concurrency 6 | tee seo.txt

      - name: "Hosts redirect with 308 and all 181 Ads pages keep GTM, tel: and the form"
        run: python3 ci/.github/seo-checks/p0_apex.py 308

      - name: Indexing headers on the 3 hubs
        run: |
          fail=0
          for c in placentia costa-mesa yorba-linda; do
            h=$(curl -sSI "$PRODUCTION_URL/service-areas/orange-county/$c")
            echo "$c: $(head -1 <<<"$h" | tr -d '\r') | X-Robots-Tag: $(grep -i '^x-robots-tag' <<<"$h" | tr -d '\r' || echo none)"
            grep -qi '^x-robots-tag:.*noindex' <<<"$h" && { echo "::error::noindex header on $c"; fail=1; }
            head -1 <<<"$h" | grep -q ' 200' || { echo "::error::$c not 200"; fail=1; }
          done
          exit $fail

      - name: "Browser: layout, JS errors, call buttons, form validation and mocked submission (no real lead)"
        run: |
          mkdir pw && cd pw && npm init -y >/dev/null && npm i playwright-core@1.56.1 --no-audit --no-fund >/dev/null
          cp ../ci/.github/seo-checks/p1_browser.cjs . && mkdir shots
          CHROME_PATH=$(command -v google-chrome) node p1_browser.cjs shots "$PRODUCTION_URL" | tee out.txt
          node - <<'JS'
          const lines = require("fs").readFileSync("out.txt", "utf8").trim().split("\n");
          let fail = lines.length !== 6;
          for (const l of lines) {
            const [city, vp, ...rest] = l.split(" "); const r = JSON.parse(rest.join(" "));
            const ok = { status200: r.status === 200, noRedirect: r.redirects.length === 0 && r.finalUrl.endsWith(`/service-areas/orange-county/${city}`),
              noJsErrors: r.jsErrors.length === 0, callButtonVisible: r.telVisible > 0, noOverflow: r.overflow === 0, oneForm: r.forms === 1 };
            if (r.formCheck) Object.assign(ok, { validationBlocksEmpty: r.formCheck.errorsShownOnEmptySubmit > 0 && r.formCheck.apiCallsAfterEmptySubmit === 0,
              oneMockedRequest: r.formCheck.apiCallsAfterValidSubmit === 1, thankYou: r.formCheck.finalUrl.startsWith("/thank-you"),
              singleConversionEvent: r.formCheck.events.filter((e) => e === "form filled").length === 1 });
            const bad = Object.entries(ok).filter(([, v]) => !v).map(([k]) => k);
            console.log(`${bad.length ? "FAIL" : "PASS"} ${city} ${vp}${bad.length ? ": " + bad.join(", ") : ""}`);
            if (bad.length) fail = true;
          }
          process.exit(fail ? 1 : 0);
          JS
